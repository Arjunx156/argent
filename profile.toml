# Who argent works for. Templates read this; nothing else hardcodes it.

[me]
name = "Arjun Krishnan"
email = "harisuresh886@gmail.com"
github = "Arjunx156"
about = "AI student at Amrita Vishwa Vidyapeetham who builds GenAI apps (agents, RAG and local LLMs) in Python and TypeScript, on Gemini, AWS Bedrock and Ollama, and ships most of them at hackathons."
university = "Amrita Vishwa Vidyapeetham"

[projects]
# where `argent projects` looks for repositories, two levels deep
roots = [
  "~/Desktop/Desktop/personal projects",
  "D:/Personal projects2.0",
]

[claude]
# a soft chime when a turn ends, another when Claude needs you
chimes = true
# hooks from other tools that deploy keeps out of settings.json, matched by their command.
# superpowers injected ~1,500 tokens a session and a rule to load skills on a 1% chance
retire_hooks = ["superpowers-plugin"]
