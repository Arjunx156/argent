# Public skill repos that `argent library sync` mirrors into ~/.claude/skill-library.
# Mirrors are data: nothing in them loads into Claude or runs. To use one, read its SKILL.md
# in full, then copy the folder into kit/claude/skills with a SOURCE file and deploy.

