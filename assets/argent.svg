<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
  <title id="t">ARGENT</title>
  <desc id="d">Arjun Krishnan's engineering environment: rebuilt in one script, kept honest by a doctor.</desc>
  <rect width="1200" height="360" rx="28" fill="#07090D"/>

  <!-- arc reactor: three rings, the middle one broken into segments -->
  <g transform="translate(212 180)" fill="none" stroke="#3DD6F5">
    <circle r="92" stroke-width="2" opacity="0.35"/>
    <circle r="72" stroke-width="10" stroke-dasharray="28 9.7" transform="rotate(-90)"/>
    <circle r="46" stroke-width="2"/>
    <circle r="18" fill="#3DD6F5" stroke="none"/>
    <path d="M0 -112 V -100 M0 100 V 112 M-112 0 H -100 M100 0 H 112" stroke-width="2" opacity="0.6"/>
  </g>

  <g font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif">
    <text x="372" y="182" font-size="112" font-weight="600" letter-spacing="28" fill="#D5DEE8">ARGENT</text>
    <text x="376" y="236" font-size="27" fill="#D5DEE8">Arjun's machine, rebuilt in one script and kept honest.</text>
  </g>

  <g font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="19" fill="#6A758A">
    <text x="376" y="290">77 tools</text>
    <text x="510" y="290">20 skills</text>
    <text x="656" y="290">1 setup script</text>
    <text x="840" y="290" fill="#3DD6F5">&#8250; argent doctor</text>
  </g>

  <!-- hud corners -->
  <path d="M40 76 V40 H76 M1124 40 H1160 V76 M1160 284 V320 H1124 M76 320 H40 V284"
        fill="none" stroke="#6A758A" stroke-width="2"/>
</svg>
