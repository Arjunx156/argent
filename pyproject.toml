[project]
name = "argent"
version = "0.1.0"
description = "Arjun Krishnan's engineering environment: one repo that rebuilds the machine and keeps it honest."
readme = "README.md"
authors = [{ name = "Arjun Krishnan", email = "harisuresh886@gmail.com" }]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
argent = "argent.cli:main"

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
extend-exclude = ["kit"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PTH"]

[tool.basedpyright]
typeCheckingMode = "standard"
include = ["src", "tests"]
